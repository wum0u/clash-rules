# FlClash／Clash Verge Rev 設定檔範本
# 把 {{...}} 換成實際的值，詳見 GUIDE.md（人）或 AGENTS.md（agent）
# 每台裝置要用自己的 WARP 帳號與 Proton 設定，不能共用
# 不需要日本節點：刪掉 >>> japan 到 <<< japan 之間的內容、結尾有「# japan」的行，再把「Proton-JP, 」刪掉

dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - system

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }

proxies:
  - name: WARP
    type: wireguard
    server: 162.159.192.1
    port: 2408
    ip: 172.16.0.2
    ipv6: {{WARP_IPV6}}
    private-key: {{WARP_PRIVATE_KEY}}
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    mtu: 1280
    udp: true
  # >>> japan：Proton VPN 免費版日本節點（限日本 IP 的服務用）
  - name: Proton-JP
    type: wireguard
    server: {{PROTON_SERVER}}
    port: 51820
    ip: 10.2.0.2
    private-key: {{PROTON_PRIVATE_KEY}}
    public-key: {{PROTON_PUBLIC_KEY}}
    persistent-keepalive: 25
    # DNS 在日本端查，網站才會連到日本機房，不會繞回臺灣
    remote-dns-resolve: true
    dns: [9.9.9.9, 8.8.8.8]
    mtu: 1280
    udp: true
  # <<< japan

proxy-groups:
  - { name: Detour, type: select, proxies: [WARP, DIRECT] }
  - { name: Japan, type: select, proxies: [Proton-JP, DIRECT] } # japan
  # 沒被規則抓到的流量；臨時要全部走日本就切成 Proton-JP
  - { name: Default, type: select, proxies: [DIRECT, Proton-JP, WARP] }

# 規則都在 https://github.com/wum0u/clash-rules ，改那邊就好，每小時自動更新
x-rules: &rules
  type: http
  behavior: classical
  format: yaml
  interval: 3600

rule-providers:
  MyDirect: { <<: *rules, url: "https://raw.githubusercontent.com/wum0u/clash-rules/main/direct.yaml", path: ./ruleset/MyDirect.yaml }
  MyJapan:  { <<: *rules, url: "https://raw.githubusercontent.com/wum0u/clash-rules/main/japan.yaml",  path: ./ruleset/MyJapan.yaml } # japan
  MyDetour: { <<: *rules, url: "https://raw.githubusercontent.com/wum0u/clash-rules/main/detour.yaml", path: ./ruleset/MyDetour.yaml }

rules:
  # 區域網路永遠直連，Default 切到國外節點時才不會斷
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,MyDirect,DIRECT
  - RULE-SET,MyJapan,Japan # japan
  - RULE-SET,MyDetour,Detour
  - MATCH,Default
